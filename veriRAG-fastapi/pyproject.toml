[project]
name = "veriRAG"
version = "1.1.1"
description = "Very RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich>=14.2.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pymilvus>=2.5.0,<3",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "alembic>=1.13.0",
    "langchain==1.3.9",
    "langchain-core>=1.2,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1.1,<2",
    "langchain-huggingface>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "sentence-transformers>=3.0.0",
    "langgraph>=1.2.4,<1.3",
    "langgraph-checkpoint-postgres>=3.1.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pypdf>=6.15.0",
    "docx2txt>=0.8",
    "unstructured",
    "openpyxl",
    "tabulate",
    "msoffcrypto-tool",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.1",
    "bcrypt>=5,<6",
    "PyJWT>=2.10,<3",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "sqlglot==30.12.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pip-audit==2.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov==7.0.0",
    "ruff>=0.6.0",
]
storage-compatibility = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.4.0",
    "pymilvus>=2.5.0,<3",
    "redis>=5.2.1",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
study = [
    "langchain-classic>=0.2.0",
    "chromadb>=0.5.5",
    "bilibili-api-python>=17.0.0",
]

[project.scripts]
supermew-auth-cleanup = "app.auth.cleanup:main"
supermew-indexing-worker = "app.workers.indexing:main"
supermew-registry = "app.tools.registry_cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "tests*"]

[tool.setuptools.package-data]
"app.skills" = ["catalog/*/skill.yaml", "catalog/*/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
extend-exclude = ["volumes"]

[tool.ruff.lint]
extend-select = ["ASYNC210", "ASYNC220", "ASYNC221", "ASYNC230", "ASYNC251"]

[tool.mypy]
python_version = "3.12"
files = [
    "agent/context.py",
    "agent/runtime.py",
    "api/routes/auth.py",
    "auth",
    "core/errors.py",
    "events/contracts.py",
    "events/generated",
    "guardrails",
    "infra/auth.py",
    "providers/core.py",
    "providers/runtime.py",
    "rate_limits",
    "runs/agent_executor.py",
    "runs/cancellation.py",
    "runs/repository.py",
    "runs/service.py",
    "runs/state.py",
    "sandbox",
    "schemas",
    "security/headers.py",
    "security/milvus_filters.py",
    "security/origins.py",
    "sql_assistant/contracts.py",
    "threads",
    "tools/contracts.py",
    "tools/control.py",
    "tools/generated",
    "web_research/citations.py",
    "web_research/contracts.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["app", "scripts"]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true

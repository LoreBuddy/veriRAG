[project]
name = "backend-verirag"
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich>=15.0.0",
    "fastapi[standard]>=0.165.0",
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "jsonschema>=4.26.0",
    "langchain>=1.5.2",
    "langchain-core>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary,pool]>=3.3.9",
    "pyjwt>=2.15.1",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlglot>=30.35.0",
    "langchain-openai>=1.8.5",
    "pymilvus>=3.0.3",
    "langchain-community>=0.4.2",
    "pypdf>=7.2.0",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.4",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["volumes"]

[tool.ruff.lint]
extend-select = ["ASYNC210", "ASYNC220", "ASYNC221", "ASYNC230", "ASYNC251"]
ignore = ["B008","I001"]

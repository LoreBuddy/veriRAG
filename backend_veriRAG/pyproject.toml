[project]
name = "backend-verirag"
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.165.0",
    "jsonschema>=4.26.0",
    "langchain-core>=1.8.5",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["volumes"]

[tool.ruff.lint]
extend-select = ["ASYNC210", "ASYNC220", "ASYNC221", "ASYNC230", "ASYNC251"]
ignore = ["B008"]
